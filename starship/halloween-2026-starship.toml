# 🎃 Halloween Starship — Catppuccin-powerline style

"$schema" = "https://starship.rs/config-schema.json"

format = """
[](purple)\
$username\
[](bg:sea fg:slate)\
$directory\
[](bg:mist fg:sea)\
$git_branch\
$git_state\
$git_status\
$git_metrics\
[](fg:mist)\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "halloween"

[palettes.halloween]
ink     = "#001014"  # background / dark text on pastel segments
ghost   = "#eeeeee"  # active_tab_foreground
muted   = "#405555"  # default foreground
slate   = "#415554"  # active_tab_background — user segment
sea     = "#449985"  # color4 — directory segment
mist    = "#5d8aa9"  # color3 — git segment
purple  = "#902EBB"  # selection_background — cap / root user
pumpkin = "#FF7518"  # selection foreground — accent
cyan    = "#58fad6"  # color15
sky     = "#8dd3fd"  # color11
mint    = "#61d4b9"  # color12
lime    = "#98cf28"  # color14 / cursor-adjacent green
green   = "#2aea5e"  # color10
coral   = "#ff4242"  # color9
rose    = "#b12f2c"  # color1


[line_break]
disabled = false

[character]
success_symbol = "[🕯️ ❯](bold fg:lime)"
error_symbol   = "[💀 ❯](bold fg:coral)"
vimcmd_symbol  = "[🎃 ❮](bold fg:green)"
vimcmd_replace_one_symbol = "[🎃 ❮](bold fg:green)"
vimcmd_replace_symbol     = "[🎃 ❮](bold fg:green)"
vimcmd_visual_symbol      = "[🎃 ❮](bold fg:pumpkin)"


[username]
show_always = true
style_user = "bg:slate fg:cyan"
style_root = "bg:purple fg:ghost"
format = "[ 🦇 $user]($style)"

[directory]
style = "bg:sea fg:ink"
format = "[ $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "🪦 "
read_only = " 🔒"
read_only_style = "fg:pumpkin bold"

[git_branch]
symbol = "🌙 "
style = "bg:mist"
format = "[[ $symbol$branch(:$remote_branch) ](fg:ghost bg:mist)]($style)"

[git_state]
style = "bg:mist"
format = "[[ ⚡ $state( $progress_current/$progress_total) ](fg:pumpkin bg:mist)]($style)"

[git_status]
style = "bg:mist"
format = "[[($all_status$ahead_behind )](fg:ghost bg:mist)]($style)"
conflicted = "👻"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "🕸"
modified = "🩸"
staged = "🎃"
renamed = "»"
deleted = "⚰"
stashed = "📦"

[git_metrics]
disabled = false
format = "[[ +$added -$deleted ](fg:ghost bg:mist)]($style)"
added_style = "fg:lime"
deleted_style = "fg:coral"

[cmd_duration]
disabled = false
min_time = 2_000
show_milliseconds = false
show_notifications = false
style = "fg:muted"
format = " ⏱ $duration "
